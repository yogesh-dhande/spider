study:
  id: exp004_sandbox_closed_loop
  run_id: selected_checkpoint
  suite_path: ../sandbox_tasks.yaml
  output_dir: outputs/experiment4/closed_loop
  control_variant: exp002_parent
  seed: 41
  repeats: 3
  max_steps: 6
  bootstrap_samples: 2000

  base:
    environment:
      type: deterministic_browser
    reward:
      type: weighted_signals
      id: default_browser_reward
      weights:
        action_validity: 0.05
        progress: 0.2
        task_success: 1.0
        action_error: -0.1
        parse_error: -0.1
    policy:
      type: qwen
      id: qwen35_2b
      config_path: configs/experiment4.yaml
      adapter_env: SPIDER_BASE_ADAPTER

  variants:
    - id: exp002_parent
      overlay:
        policy:
          id: exp002_parent
          adapter_env: SPIDER_BASE_ADAPTER

    - id: exp004_selected
      overlay:
        policy:
          id: exp004_selected
          adapter_env: SPIDER_SFT_ADAPTER
