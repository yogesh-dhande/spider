dataset_ladder:
  id: exp005_browser_ablation_v1
  seed: 53
  # This first immutable ladder contains metadata locators. The materializer rewrites it into the
  # final shared image corpus at data/exp005_browser_ablation_v1.
  output_dir: ../../data/exp005_browser_selection_v1
  # These metadata-only candidate manifests are created by the full-shard inventory phase.
  # Images are downloaded only after the manifests and leakage audit are frozen.
  train_manifests:
    - ../../data/exp005_browser_inventory/manifests/action_train_candidates.jsonl
    - ../../data/exp005_browser_inventory/manifests/qa_train_candidates.jsonl
    - ../../data/exp005_browser_inventory/manifests/grounding_train_candidates.jsonl
  evaluation_suites:
    iid:
      manifests:
        - ../../data/exp005_browser_inventory/manifests/eval_iid.jsonl
      required_disjoint: [id, sampling_unit]
    domain_balanced:
      manifests:
        - ../../data/exp005_browser_inventory/manifests/eval_domain_balanced.jsonl
      required_disjoint: [id, sampling_unit, known_domain]
    distribution_shift:
      manifests:
        - ../../data/exp005_browser_inventory/manifests/eval_distribution_shift.jsonl
      required_disjoint: [id, sampling_unit, known_domain]
  unknown_domain_policy: reject
  # The grounding source is concentrated in six major domains. With a fixed 13% grounding mix,
  # the strictest feasible combined cap across every nested tier is 6.5%.
  max_combined_domain_share: 0.065
  website_sampling:
    # Cover every interaction family in every tier, then bias remaining capacity toward apps.
    required_categories:
      - work_application
      - transactional_application
      - service_application
      - content_reference
      - general_web
    minimum_category_share: 0.05
    category_weights:
      work_application: 4.0
      transactional_application: 2.0
      service_application: 2.0
      general_web: 1.0
      content_reference: 0.5
  tasks:
    action:
      # Fixed 54/33/13 task proportions make size the only ladder variable.
      sizes: {small: 5400, medium: 16200, large: 54000}
      temperature: 0.5
      max_domain_share: 0.03
      max_per_unit: 4
      website_sampling: {minimum_category_share: 0.01}
    qa:
      sizes: {small: 3300, medium: 9900, large: 33000}
      temperature: 0.5
      max_domain_share: 0.02
      max_per_unit: 3
    grounding:
      sizes: {small: 1300, medium: 3900, large: 13000}
      temperature: 0.5
      max_domain_share: 0.29
      max_per_unit: 1
      website_sampling: {minimum_category_share: 0.001}
materialization:
  selection_dir: ../../data/exp005_browser_selection_v1
  output_dir: ../../data/exp005_browser_ablation_v1
  max_width: 1280
  max_height: 720
  jpeg_quality: 90
