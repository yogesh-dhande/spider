dataset_ladder:
  id: exp005_browser_ablation_v1
  seed: 53
  output_dir: ../../data/exp005_browser_ablation_v1
  # These metadata-only candidate manifests are created by the full-shard inventory phase.
  # Images are downloaded only after the manifests and leakage audit are frozen.
  train_manifests:
    - ../../data/exp005_browser_inventory/manifests/action_train_candidates.jsonl
    - ../../data/exp005_browser_inventory/manifests/qa_train_candidates.jsonl
    - ../../data/exp005_browser_inventory/manifests/grounding_train_candidates.jsonl
  evaluation_suites:
    iid:
      manifests:
        - ../../data/exp005_browser_inventory/manifests/eval_iid.jsonl
      required_disjoint: [id, sampling_unit]
    domain_balanced:
      manifests:
        - ../../data/exp005_browser_inventory/manifests/eval_domain_balanced.jsonl
      required_disjoint: [id, sampling_unit, known_domain]
    distribution_shift:
      manifests:
        - ../../data/exp005_browser_inventory/manifests/eval_distribution_shift.jsonl
      required_disjoint: [id, sampling_unit, known_domain]
  unknown_domain_policy: reject
  max_combined_domain_share: 0.02
  website_sampling:
    # Cover every interaction family in every tier, then bias remaining capacity toward apps.
    required_categories:
      - work_application
      - transactional_application
      - service_application
      - content_reference
      - general_web
    minimum_category_share: 0.05
    category_weights:
      work_application: 4.0
      transactional_application: 2.0
      service_application: 2.0
      general_web: 1.0
      content_reference: 0.5
  tasks:
    action:
      sizes: {small: 6000, medium: 18000, large: 60000}
      temperature: 0.5
      max_domain_share: 0.02
      max_per_unit: 4
    qa:
      sizes: {small: 2000, medium: 6000, large: 20000}
      temperature: 0.5
      max_domain_share: 0.02
      max_per_unit: 3
    grounding:
      sizes: {small: 2000, medium: 6000, large: 20000}
      temperature: 0.5
      max_domain_share: 0.02
      max_per_unit: 1
