[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spider-browser-vl"
version = "0.1.0"
description = "Kaggle-first experiments for browser screenshot understanding and GUI grounding"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "datasets>=3.2",
  "pillow>=10.4",
  "pyyaml>=6.0.2",
  "tldextract>=5.1",
  "tqdm>=4.67",
]

[project.optional-dependencies]
train = [
  "accelerate>=1.2",
  "bitsandbytes>=0.45",
  "peft>=0.14",
  "torch>=2.4",
  "transformers>=4.57.0",
  "trl>=0.26.1",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
spider-prepare = "spider.prepare:main"
spider-train = "spider.train:main"
spider-evaluate = "spider.evaluate:main"
spider-compare = "spider.compare:main"
spider-archive = "spider.archive:main"
spider-smoke = "spider.smoke:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spider"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
