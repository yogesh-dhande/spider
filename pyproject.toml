[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spider-browser-vl"
version = "0.1.0"
description = "Kaggle-first experiments for browser screenshot understanding and GUI grounding"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "datasets>=3.2",
  "huggingface-hub>=0.27",
  "pyarrow>=18.0",
  "pillow>=10.4",
  "pyyaml>=6.0.2",
  "tldextract>=5.1",
  "tqdm>=4.67",
]

[project.optional-dependencies]
train = [
  "accelerate>=1.2",
  "bitsandbytes>=0.45",
  "peft>=0.14",
  "torch>=2.4",
  "transformers>=4.57.0",
  "trl>=0.26.1",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]
browser = [
  "playwright==1.61.0",
]

[project.scripts]
spider-prepare = "spider.prepare:main"
spider-train = "spider.train:main"
spider-evaluate = "spider.evaluate:main"
spider-merge = "spider.merge:main"
spider-compare = "spider.compare:main"
spider-archive = "spider.archive:main"
spider-smoke = "spider.smoke:main"
spider-study = "spider.rl.study:main"
spider-study-merge = "spider.rl.study:merge_main"
spider-prepare-actions = "spider.action_data:main"
spider-evaluate-actions = "spider.action_evaluate:main"
spider-finalize-exp4-data = "spider.exp4_data:main"
spider-merge-actions = "spider.action_merge:main"
spider-audit-diversity = "spider.diversity:main"
spider-build-data-ladder = "spider.data_ladder:main"
spider-inventory-sources = "spider.source_inventory:main"
spider-materialize-corpus = "spider.corpus_materializer:main"
spider-benchmark-eval = "spider.benchmark_eval:main"
spider-compare-eval-shards = "spider.eval_reproducibility:main"
spider-build-scaling-schedule = "spider.scaling_schedule:main"
spider-scaling-gate = "spider.scaling_gate:main"
spider-register-candidate = "spider.candidate_registry:main"
spider-process-checkpoint = "spider.checkpoint_postprocess:main"
spider-extract-dashboard-images = "spider.dashboard_images:main"
spider-ablation-matrix = "spider.ablation_matrix:main"
spider-build-dataset-dashboard = "spider.dataset_dashboard:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spider"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
